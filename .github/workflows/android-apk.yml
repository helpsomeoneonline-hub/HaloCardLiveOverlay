name: Build HaloCard Overlay APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore Android source
        run: |
          base64 --decode app-source.b64 > app-source.zip
          unzip -oq app-source.zip
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
      - name: Apply v1.1 display and auto-refresh fixes
        run: |
          base64 --decode upgrade-v1.1.patch.xz.b64 | xz -dc > upgrade-v1.1.patch
          patch -p1 --batch < upgrade-v1.1.patch
          grep -q 'versionCode = 2' app/build.gradle.kts
          test -f app/src/main/java/com/byso/halocardoverlay/DashboardAccessibilityService.kt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HaloCard-Live-Overlay-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish APK download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.1.0 "app/build/outputs/apk/debug/app-debug.apk#HaloCardLiveOverlay-v1.1.apk" --title "HaloCard Live Overlay 1.1" --notes "Version 1.1: dashboard-only overlay, continuous refresh, and draggable saved position. Debug signed: previous v1.0 may need uninstall because GitHub runners use different debug keys. Enable the new Accessibility permission for Chrome URL detection." --target "$GITHUB_SHA" || gh release upload v1.1.0 "app/build/outputs/apk/debug/app-debug.apk#HaloCardLiveOverlay-v1.1.apk" --clobber
