name: Build HaloCard Overlay APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore Android source
        run: |
          base64 --decode app-source.b64 > app-source.zip
          unzip -oq app-source.zip
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
      - name: Apply v1.2 overlay visibility fix
        run: |
          base64 --decode patches/halocard-v1.2.patch.xz.b64 | xz -dc | patch -p1
          test -f app/src/main/java/com/byso/halocardoverlay/DashboardAccessibilityService.kt
          grep -q 'versionCode = 3' app/build.gradle.kts
      - name: Apply v1.3 Firefox compatibility patch
        run: |
          patch --batch -p1 < patches/halocard-v1.3-browser-support.patch
          grep -q 'versionCode = 4' app/build.gradle.kts
      - name: Apply v1.4 Firefox active-tab visibility fix
        run: |
          patch --batch -p1 < patches/halocard-v1.4-active-tab.patch
          grep -q 'versionCode = 5' app/build.gradle.kts
      - name: Apply v1.5 Firefox ANR and OCR threading fix
        run: |
          patch --batch -p1 < patches/halocard-v1.5-anr-hotfix.patch
          grep -q 'versionCode = 6' app/build.gradle.kts
      - name: Apply v1.6 diagnostics and compact-bubble patch
        run: |
          base64 --decode patches/halocard-v1.6-diagnostics-bubble.patch.xz.b64 | xz -dc | patch -p1 --batch
          grep -q 'versionCode = 7' app/build.gradle.kts
          test -f app/src/main/java/com/byso/halocardoverlay/Diagnostics.kt
      - name: Fix Firefox blinking and update version to 1.7
        run: |
          python3 .github/scripts/fix_overlay_blink_v17.py
          grep -q 'versionCode = 8' app/build.gradle.kts
      - name: Improve Firefox toolbar detection for v1.8
        run: |
          python3 .github/scripts/fix_firefox_v18.py
          grep -q 'versionCode = 9' app/build.gradle.kts
      - name: Firefox visual fallback and direct diagnostic export v1.9
        run: |
          base64 --decode patches/halocard-v1.9-firefox-diagnostics.patch.xz.b64 | xz -dc | patch --batch -p1
          grep -q 'versionCode = 10' app/build.gradle.kts
          grep -q 'fun verifyFirefoxFrame' app/src/main/java/com/byso/halocardoverlay/BalanceCaptureService.kt
      - name: Validate card limit OCR and confirm two frames for v2.0
        run: |
          python3 .github/scripts/fix_card_amount_v20.py
          grep -q 'versionCode = 11' app/build.gradle.kts
          grep -q 'repeatedBalanceFrames >= 2' app/src/main/java/com/byso/halocardoverlay/BalanceCaptureService.kt
      - name: Upload source snapshot for Firefox diagnosis
        uses: actions/upload-artifact@v4
        with:
          name: HaloCard-v2.0-reconstructed-source
          path: |
            app/src/main/java/com/byso/halocardoverlay/
            app/src/main/AndroidManifest.xml
            app/src/main/res/xml/dashboard_accessibility_service.xml
            app/build.gradle.kts
          if-no-files-found: error
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build APK with permanent signing key when configured
        id: buildapk
        env:
          HALOCARD_SIGNING_BUNDLE_B64: ${{ secrets.HALOCARD_SIGNING_BUNDLE_B64 }}
        run: |
          if [ -n "$HALOCARD_SIGNING_BUNDLE_B64" ]; then
            mkdir -p "$RUNNER_TEMP/halocard-signing"
            python3 .github/scripts/decode_signing.py
            export HALOCARD_KEYSTORE_PATH="$RUNNER_TEMP/halocard-signing/halocard-release.jks"
            export HALOCARD_STORE_PASSWORD="$(cat "$RUNNER_TEMP/halocard-signing/signing-pass.txt")"
            test -s "$HALOCARD_KEYSTORE_PATH"
            gradle --no-daemon --stacktrace :app:assembleRelease
            echo "stable=true" >> "$GITHUB_OUTPUT"
            echo "apk=app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_OUTPUT"
          else
            echo "Permanent signing secret missing. Building diagnostic preview ONLY."
            gradle --no-daemon --stacktrace :app:assembleDebug
            echo "stable=false" >> "$GITHUB_OUTPUT"
            echo "apk=app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload built APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HaloCard-Live-Overlay-v2.0-apk
          path: ${{ steps.buildapk.outputs.apk }}
          if-no-files-found: error
      - name: Publish permanently signed APK
        if: steps.buildapk.outputs.stable == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v2.0.0 "app/build/outputs/apk/release/app-release.apk#HaloCardLiveOverlay-v2.0.apk" --title "HaloCard Live Overlay 2.0" --notes "Permanently signed. Rejects OCR readings when the spent amount exceeds a recognized card limit, and confirms the card figures across two consecutive captures before updating. Chrome and Firefox behavior preserved." --target "$GITHUB_SHA" || gh release upload v2.0.0 "app/build/outputs/apk/release/app-release.apk#HaloCardLiveOverlay-v2.0.apk" --clobber
      - name: Publish temporary debug preview
        if: steps.buildapk.outputs.stable != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v2.0.0-preview "app/build/outputs/apk/debug/app-debug.apk#HaloCardLiveOverlay-v2.0-PREVIEW.apk" --title "HaloCard Live Overlay 2.0 Preview" --notes "Debug-signed preview; not an upgrade to permanent release." --target "$GITHUB_SHA" || gh release upload v2.0.0-preview "app/build/outputs/apk/debug/app-debug.apk#HaloCardLiveOverlay-v2.0-PREVIEW.apk" --clobber
