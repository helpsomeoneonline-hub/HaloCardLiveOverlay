name: Build HaloCard Overlay APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore Android source
        run: |
          base64 --decode app-source.b64 > app-source.zip
          unzip -oq app-source.zip
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
      - name: Apply v1.2 overlay visibility fix
        run: |
          base64 --decode patches/halocard-v1.2.patch.xz.b64 | xz -dc | patch -p1
          test -f app/src/main/java/com/byso/halocardoverlay/DashboardAccessibilityService.kt
          grep -q 'versionCode = 3' app/build.gradle.kts
      - name: Apply v1.3 Firefox compatibility patch
        run: |
          patch --batch -p1 < patches/halocard-v1.3-browser-support.patch
          grep -q 'versionCode = 4' app/build.gradle.kts
      - name: Apply v1.4 Firefox active-tab visibility fix
        run: |
          patch --batch -p1 < patches/halocard-v1.4-active-tab.patch
          grep -q 'versionCode = 5' app/build.gradle.kts
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HaloCard-Live-Overlay-v1.4-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish APK download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.4.0 "app/build/outputs/apk/debug/app-debug.apk#HaloCardLiveOverlay-v1.4.apk" --title "HaloCard Live Overlay 1.4" --notes "Firefox tab-only visibility: verifies current address bar, rejects inactive tabs and tab previews, hides on tab changes and off-dashboard. Also supports Chrome. Device validation still needed; debug signing can require uninstall." --target "$GITHUB_SHA" || gh release upload v1.4.0 "app/build/outputs/apk/debug/app-debug.apk#HaloCardLiveOverlay-v1.4.apk" --clobber
